name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  distro:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [debian:12, debian:13, ubuntu:22.04, ubuntu:24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Unit and API integration tests
        run: >-
          docker run --rm -v "$PWD:/work" -w /work ${{ matrix.image }}
          sh -c 'apt-get update && apt-get install -y python3 && python3 -m unittest discover -s tests -v && python3 -m compileall -q vpsmanager && sh -n install.sh && sh -n vps-manager.sh'
  systemd-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vps-manager-test -f tests/Dockerfile.systemd .
      - run: docker run -d --name vps-manager-test --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$PWD:/work" -w /work vps-manager-test
      - run: docker exec -e VPS_MANAGER_DISPOSABLE_TEST=1 vps-manager-test python3 tests/systemd_smoke.py
      - if: always()
        run: docker rm -f vps-manager-test || true
